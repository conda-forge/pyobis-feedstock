schema_version: 1

context:
  version: "1.6.2"

package:
  name: pyobis
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pyobis/pyobis-${{ version }}.tar.gz
  sha256: 14366896c5c96360124334121cb9e916b7364cc0a4839338cdffc0ae071aec83

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools >=41.2
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - pandas
    - requests >=2.7
    - requests-cache >=1.2.0,<2.0.0
    - urllib3 <2.0.0

tests:
  - python:
      imports:
        - pyobis
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Python client for OBIS
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/pyobis/
  documentation: https://iobis.github.io/pyobis

extra:
  recipe-maintainers:
    - ocefpaf
