{% set name = "pyobis" %}
{% set version = "1.6.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/pyobis-{{ version }}.tar.gz
  sha256: 14366896c5c96360124334121cb9e916b7364cc0a4839338cdffc0ae071aec83

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=41.2
    - setuptools-scm
    - wheel
    - pip
  run:
    - urllib3 <2.0.0
    - requests-cache >=1.2.0,<2.0.0
    - python >={{ python_min }}
    - requests >=2.7
    - pandas

test:
  imports:
    - pyobis
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/iobis/pyobis
  summary: Python client for OBIS
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ocefpaf
